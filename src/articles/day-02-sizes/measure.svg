<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1180" width="680" height="1180" role="img">
<title>肩骨、腕骨、鞋面三处定码</title>
<rect width="680" height="1180" fill="#f3ecdf"/>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans SC, WenQuanYi Micro Hei, sans-serif">
  <text x="36" y="52" font-size="28" fill="#1c1915">只认这三处，不认吊牌上的 L</text>
  <text x="36" y="88" font-size="18" fill="#6e665c">红点是你的肩骨、腕骨和鞋面。181 cm 先摸骨头。</text>

  <line x1="36" y1="150" x2="36" y2="900" stroke="#7c3140" stroke-width="2"/>
  <text x="24" y="530" font-size="16" fill="#7c3140" transform="rotate(-90 24 530)">身高 181</text>

  <g stroke-linejoin="round">
    <ellipse cx="190" cy="186" rx="32" ry="38" fill="#e0b07c" stroke="#3a2a22" stroke-width="2"/>
    <path d="M162 158c8-26 50-28 60 2 3 10-12 16-31 16s-33-6-29-18z" fill="#342820"/>
    <circle cx="178" cy="190" r="2.2" fill="#3a2a22"/>
    <circle cx="204" cy="190" r="2.2" fill="#3a2a22"/>
    <path d="M180 208c6 4 16 4 22 0" fill="none" stroke="#3a2a22" stroke-width="1.6"/>
    <rect x="176" y="220" width="28" height="26" fill="#e0b07c"/>

    <path d="M110 268h160l22 252H88z" fill="#1e3558" stroke="#0e1c30" stroke-width="2"/>
    <path d="M110 272 L74 292 L58 430 L96 442 L132 296 Z" fill="#162844" stroke="#0e1c30" stroke-width="2"/>
    <path d="M270 272 L306 292 L322 430 L284 442 L248 296 Z" fill="#162844" stroke="#0e1c30" stroke-width="2"/>
    <path d="M58 430 L96 442 L100 460 L62 448 Z" fill="#f4efe4" stroke="#b9a48a" stroke-width="1.6"/>
    <path d="M322 430 L284 442 L280 460 L318 448 Z" fill="#f4efe4" stroke="#b9a48a" stroke-width="1.6"/>
    <ellipse cx="78" cy="486" rx="16" ry="18" fill="#e0b07c" stroke="#3a2a22" stroke-width="1.6"/>
    <ellipse cx="302" cy="486" rx="16" ry="18" fill="#e0b07c" stroke="#3a2a22" stroke-width="1.6"/>

    <path d="M190 274 L158 348 L186 328 Z" fill="#162844"/>
    <path d="M190 274 L222 348 L194 328 Z" fill="#314e78"/>
    <path d="M164 248h52v36c-8 12-44 12-52 0z" fill="#e4d3bc" stroke="#b9a48a" stroke-width="1.5"/>
    <circle cx="190" cy="360" r="3.2" fill="#0e1c30"/>
    <circle cx="190" cy="408" r="3.2" fill="#0e1c30"/>
    <circle cx="190" cy="456" r="3.2" fill="#0e1c30"/>

    <path d="M132 500 L118 830 L168 830 L176 548 L204 548 L212 830 L262 830 L248 500 Z" fill="#c4a36a" stroke="#6b4b32" stroke-width="2"/>
    <path d="M104 812h76v16c2 18-10 34-22 38h-62c-14-8-16-24-12-38z" fill="#6b4b32"/>
    <path d="M196 812h76v16c2 18-10 34-22 38h-62c-14-8-16-24-12-38z" fill="#6b4b32"/>
  </g>

  <g fill="#7c3140" stroke="#fff" stroke-width="2">
    <circle cx="112" cy="274" r="7"/>
    <circle cx="268" cy="274" r="7"/>
    <circle cx="80" cy="454" r="7"/>
    <circle cx="300" cy="454" r="7"/>
    <circle cx="118" cy="820" r="7"/>
    <circle cx="262" cy="820" r="7"/>
  </g>
  <text x="328" y="424" font-size="16" fill="#7c3140">一指</text>

  <line x1="276" y1="274" x2="378" y2="250" stroke="#7c3140" stroke-width="2"/>
  <line x1="308" y1="454" x2="378" y2="430" stroke="#7c3140" stroke-width="2"/>
  <line x1="270" y1="820" x2="378" y2="790" stroke="#7c3140" stroke-width="2"/>

  <g>
    <rect x="384" y="188" width="268" height="132" rx="14" fill="#fffdf8" stroke="#e4d8c8"/>
    <text x="404" y="224" font-size="24" fill="#7c3140">1 肩缝</text>
    <text x="404" y="258" font-size="20" fill="#1c1915">红点在肩角上。</text>
    <text x="404" y="290" font-size="18" fill="#6e665c">缝滑到袖子上就放下。</text>

    <rect x="384" y="368" width="268" height="150" rx="14" fill="#fffdf8" stroke="#e4d8c8"/>
    <text x="404" y="404" font-size="24" fill="#7c3140">2 袖口</text>
    <text x="404" y="438" font-size="20" fill="#1c1915">红点在腕骨上。</text>
    <text x="404" y="470" font-size="18" fill="#6e665c">奶白袖口再长出一指。</text>
    <text x="404" y="498" font-size="18" fill="#6e665c">短两厘米可以改。</text>

    <rect x="384" y="720" width="268" height="168" rx="14" fill="#fffdf8" stroke="#e4d8c8"/>
    <text x="404" y="756" font-size="24" fill="#7c3140">3 裤脚</text>
    <text x="404" y="790" font-size="20" fill="#1c1915">红点在鞋面上。</text>
    <text x="404" y="822" font-size="18" fill="#6e665c">穿切尔西或牛津鞋试。</text>
    <text x="404" y="850" font-size="18" fill="#6e665c">九分会把脚踝露出来。</text>
  </g>

  <rect x="24" y="960" width="632" height="180" rx="16" fill="#fffdf8" stroke="#e4d8c8"/>
  <text x="48" y="1008" font-size="26" fill="#1c1915">胸口空一掌，也停在这一码</text>
  <text x="48" y="1052" font-size="20" fill="#3a342c">72kg 肩对了，胸还是平的。这是厚度不够。</text>
  <text x="48" y="1088" font-size="20" fill="#3a342c">用燕麦高领去填，不要改拿 185。</text>
  <text x="48" y="1124" font-size="18" fill="#6e665c">大一号会把肩缝推离肩骨，胸口的空还在。</text>
</g>
</svg>
