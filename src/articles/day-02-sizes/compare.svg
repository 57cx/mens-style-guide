<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1880" width="680" height="1880" role="img">
<title>放大一码和停在肩对的码</title>
<rect width="680" height="1880" fill="#f3ecdf"/>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans SC, WenQuanYi Micro Hei, sans-serif">
  <text x="36" y="52" font-size="28" fill="#1c1915">同一位 181 / 72、偏黄肤色</text>

  <rect x="24" y="78" width="632" height="860" rx="18" fill="#fffdf8" stroke="#e7c7c7"/>
  <text x="48" y="122" font-size="28" fill="#7c3140">不适合：放大到 185，再用九分凑</text>

  <g transform="translate(168 140)" stroke-linejoin="round">
    <ellipse cx="0" cy="36" rx="26" ry="32" fill="#e0b07c" stroke="#3a2a22" stroke-width="2"/>
    <path d="M-22 16c4-20 40-22 46 0 2 8-8 12-23 12s-25-4-23-12z" fill="#342820"/>
    <circle cx="-8" cy="38" r="1.7" fill="#3a2a22"/>
    <circle cx="10" cy="38" r="1.7" fill="#3a2a22"/>
    <path d="M-6 50c4 3 10 3 14 0" fill="none" stroke="#3a2a22" stroke-width="1.4"/>
    <path d="M-8 66h16v16h-16z" fill="#e0b07c"/>

    <path d="M-118 150c-8 36 6 120 22 150 8 10 18 4 14-8L-48 168z" fill="#243e66"/>
    <path d="M118 150c8 36-6 120-22 150-8 10-18 4-14-8L48 168z" fill="#243e66"/>
    <path d="M-86 78h172l36 250H-122z" fill="#2a4a78" stroke="#0e1c30" stroke-width="2"/>
    <path d="M-10 92 L-36 150 L-4 136Z" fill="#1a3358"/>
    <path d="M10 92 L36 150 L4 136Z" fill="#3d5d86"/>

    <circle cx="-52" cy="108" r="6" fill="#7c3140" stroke="#fff" stroke-width="2"/>
    <circle cx="52" cy="108" r="6" fill="#7c3140" stroke="#fff" stroke-width="2"/>
    <line x1="-108" y1="156" x2="-78" y2="156" stroke="#f4efe4" stroke-width="4"/>
    <line x1="108" y1="156" x2="78" y2="156" stroke="#f4efe4" stroke-width="4"/>

    <path d="M-30 300 L-26 430 h18 L-4 320 L6 430 h18 L28 300z" fill="#1c1c1c" stroke="#111" stroke-width="2"/>
    <rect x="-24" y="428" width="16" height="40" fill="#e0b07c"/>
    <rect x="10" y="428" width="16" height="40" fill="#e0b07c"/>
    <path d="M-40 466h40v16h-46z" fill="#6b4b32"/>
    <path d="M6 466h40v16H0z" fill="#6b4b32"/>

    <rect x="-46" y="200" width="54" height="28" rx="6" fill="#7c3140"/>
    <text x="-19" y="220" text-anchor="middle" font-size="16" fill="#fff">185</text>
  </g>
  <text x="470" y="250" font-size="18" fill="#7c3140">肩骨</text>
  <text x="470" y="310" font-size="18" fill="#7c3140">缝在袖上</text>
  <text x="470" y="620" font-size="18" fill="#7c3140">脚踝露了</text>
  <line x1="250" y1="248" x2="460" y2="244" stroke="#7c3140" stroke-width="1.6"/>
  <line x1="300" y1="296" x2="460" y2="304" stroke="#7c3140" stroke-width="1.6"/>
  <line x1="210" y1="600" x2="460" y2="614" stroke="#7c3140" stroke-width="1.6"/>

  <g font-size="22" fill="#3a342c">
    <text x="48" y="820">肩缝离开肩骨，181 的肩宽空了。</text>
    <text x="48" y="858">九分停在脚踝上，腿被切成两段。</text>
    <text x="48" y="896">72kg 胸口空，放大一码只是加了空布。</text>
  </g>

  <rect x="24" y="970" width="632" height="870" rx="18" fill="#fffdf8" stroke="#d5dec8"/>
  <text x="48" y="1014" font-size="28" fill="#3f5134">适合：停在肩对的那一码</text>

  <g transform="translate(250 1040)" stroke-linejoin="round">
    <ellipse cx="0" cy="36" rx="26" ry="32" fill="#e0b07c" stroke="#3a2a22" stroke-width="2"/>
    <path d="M-22 16c4-20 40-22 46 0 2 8-8 12-23 12s-25-4-23-12z" fill="#342820"/>
    <circle cx="-8" cy="38" r="1.7" fill="#3a2a22"/>
    <circle cx="10" cy="38" r="1.7" fill="#3a2a22"/>
    <path d="M-6 50c4 3 10 3 14 0" fill="none" stroke="#3a2a22" stroke-width="1.4"/>
    <path d="M-8 66h16v16h-16z" fill="#e0b07c"/>
    <path d="M-36 168 L-46 400 h30 L-8 190 L8 400 h30 L34 168z" fill="#1c1c1c" stroke="#111" stroke-width="2"/>
    <path d="M-58 372h46c6 12 4 30-6 38h-48z" fill="#1c1c1c"/>
    <path d="M12 372h46c6 12 4 30-6 38H6z" fill="#1c1c1c"/>
    <path d="M-74 88c-16 34-14 140 2 196 6 8 16 4 12-8L-34 128z" fill="#162844"/>
    <path d="M74 88c16 34 14 140-2 196-6 8-16 4-12-8L34 128z" fill="#162844"/>
    <path d="M-86 250h18v16h-22z" fill="#f4efe4" stroke="#b9a48a" stroke-width="1.4"/>
    <path d="M68 250h18v16h-22z" fill="#f4efe4" stroke="#b9a48a" stroke-width="1.4"/>
    <path d="M-44 76h88l20 230H-64z" fill="#1e3558" stroke="#0e1c30" stroke-width="2"/>
    <path d="M-6 84 L-24 138 L-2 124Z" fill="#162844"/>
    <path d="M6 84 L24 138 L2 124Z" fill="#314e78"/>
    <path d="M-16 64h32v26h-32z" fill="#f4efe4" stroke="#b9a48a" stroke-width="1.4"/>
    <circle cx="-70" cy="96" r="6" fill="#7c3140" stroke="#fff" stroke-width="2"/>
    <circle cx="70" cy="96" r="6" fill="#7c3140" stroke="#fff" stroke-width="2"/>
    <circle cx="-78" cy="262" r="5" fill="#7c3140" stroke="#fff" stroke-width="2"/>
    <circle cx="78" cy="262" r="5" fill="#7c3140" stroke="#fff" stroke-width="2"/>
    <circle cx="-30" cy="378" r="5" fill="#7c3140" stroke="#fff" stroke-width="2"/>
    <circle cx="30" cy="378" r="5" fill="#7c3140" stroke="#fff" stroke-width="2"/>
  </g>
  <text x="500" y="1140" font-size="18" fill="#3f5134">缝在肩骨</text>
  <text x="500" y="1320" font-size="18" fill="#3f5134">袖口加一指</text>
  <text x="500" y="1440" font-size="18" fill="#3f5134">裤脚碰鞋面</text>
  <line x1="340" y1="1136" x2="490" y2="1134" stroke="#3f5134" stroke-width="1.6"/>
  <line x1="340" y1="1302" x2="490" y2="1314" stroke="#3f5134" stroke-width="1.6"/>
  <line x1="290" y1="1420" x2="490" y2="1434" stroke="#3f5134" stroke-width="1.6"/>

  <g font-size="22" fill="#3a342c">
    <text x="48" y="1708">肩缝在肩骨上，这个码就停。</text>
    <text x="48" y="1746">奶白衬衫比大衣长一指，黄皮领口是干净的。</text>
    <text x="48" y="1784">黑西裤轻碰牛津鞋，不露踝，也不堆一圈。</text>
  </g>
</g>
</svg>
