<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1520" width="680" height="1520" role="img">
<title>试衣间的五步顺序</title>
<rect width="680" height="1520" fill="#f3ecdf"/>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans SC, WenQuanYi Micro Hei, sans-serif">
  <text x="36" y="52" font-size="28" fill="#1c1915">进店只按这个顺序</text>
  <text x="36" y="90" font-size="18" fill="#6e665c">十一月的上海，试衣间里也穿上出门的那一层。</text>

  <rect x="24" y="116" width="632" height="220" rx="16" fill="#fffdf8" stroke="#e4d8c8"/>
  <circle cx="78" cy="188" r="28" fill="#7c3140"/>
  <text x="78" y="198" text-anchor="middle" font-size="26" fill="#fff">1</text>
  <text x="124" y="176" font-size="26" fill="#1c1915">先穿上这周的鞋</text>
  <text x="124" y="214" font-size="20" fill="#3a342c">切尔西、牛津或运动鞋。</text>
  <text x="124" y="248" font-size="20" fill="#3a342c">不穿店里的拖鞋。</text>
  <text x="124" y="282" font-size="18" fill="#6e665c">裤长跟着鞋走。</text>
  <g transform="translate(520 150)">
    <path d="M8 70h86v18c2 16-12 28-24 30H20c-16-6-18-20-14-30z" fill="#6b4b32"/>
    <path d="M24 28h48l8 44H16z" fill="#1c1c1c"/>
    <text x="48" y="18" text-anchor="middle" font-size="14" fill="#6e665c">鞋面</text>
  </g>

  <rect x="24" y="356" width="632" height="220" rx="16" fill="#fffdf8" stroke="#e4d8c8"/>
  <circle cx="78" cy="428" r="28" fill="#7c3140"/>
  <text x="78" y="438" text-anchor="middle" font-size="26" fill="#fff">2</text>
  <text x="124" y="416" font-size="26" fill="#1c1915">再穿上内搭</text>
  <text x="124" y="454" font-size="20" fill="#3a342c">燕麦高领或奶白衬衫。</text>
  <text x="124" y="488" font-size="20" fill="#3a342c">店里热，街上并不热。</text>
  <text x="124" y="522" font-size="18" fill="#6e665c">袖长按两层来量。</text>
  <g transform="translate(530 400)">
    <path d="M20 24h70v92H20z" fill="#e4d3bc" stroke="#b9a48a" stroke-width="2"/>
    <path d="M38 24c8 16 26 16 34 0v16H38z" fill="#cbb89a"/>
    <path d="M34 78h42v28H34z" fill="#f4efe4" stroke="#b9a48a" stroke-width="1.5"/>
  </g>

  <rect x="24" y="596" width="632" height="220" rx="16" fill="#fffdf8" stroke="#e4d8c8"/>
  <circle cx="78" cy="668" r="28" fill="#7c3140"/>
  <text x="78" y="678" text-anchor="middle" font-size="26" fill="#fff">3</text>
  <text x="124" y="656" font-size="26" fill="#1c1915">摸肩缝，定这个码</text>
  <text x="124" y="694" font-size="20" fill="#3a342c">食指摸到肩最外缘。</text>
  <text x="124" y="728" font-size="20" fill="#3a342c">缝在骨头上就留下。</text>
  <text x="124" y="762" font-size="18" fill="#6e665c">滑到袖子上就放下。</text>
  <g transform="translate(524 640)">
    <path d="M18 36h90l8 70H10z" fill="#1e3558" stroke="#0e1c30" stroke-width="2"/>
    <path d="M18 40 L2 52 L8 78 L28 46 Z" fill="#162844"/>
    <circle cx="20" cy="40" r="6" fill="#7c3140" stroke="#fff" stroke-width="2"/>
    <text x="58" y="28" text-anchor="middle" font-size="14" fill="#7c3140">肩骨</text>
  </g>

  <rect x="24" y="836" width="632" height="220" rx="16" fill="#fffdf8" stroke="#e4d8c8"/>
  <circle cx="78" cy="908" r="28" fill="#7c3140"/>
  <text x="78" y="918" text-anchor="middle" font-size="26" fill="#fff">4</text>
  <text x="124" y="896" font-size="26" fill="#1c1915">袖口对到腕骨</text>
  <text x="124" y="934" font-size="20" fill="#3a342c">手臂垂下，外套停在腕骨。</text>
  <text x="124" y="968" font-size="20" fill="#3a342c">衬衫再长出大约一指。</text>
  <text x="124" y="1002" font-size="18" fill="#6e665c">差一两厘米可以改。</text>
  <g transform="translate(536 880)">
    <path d="M34 8h36v62H34z" fill="#1e3558" stroke="#0e1c30" stroke-width="2"/>
    <path d="M34 70h36v16H34z" fill="#f4efe4" stroke="#b9a48a" stroke-width="1.5"/>
    <ellipse cx="52" cy="104" rx="16" ry="14" fill="#e0b07c" stroke="#3a2a22" stroke-width="1.4"/>
    <line x1="78" y1="70" x2="96" y2="70" stroke="#7c3140" stroke-width="2"/>
    <line x1="78" y1="86" x2="96" y2="86" stroke="#7c3140" stroke-width="2"/>
    <line x1="96" y1="70" x2="96" y2="86" stroke="#7c3140" stroke-width="2"/>
    <text x="78" y="60" font-size="14" fill="#7c3140">一指</text>
  </g>

  <rect x="24" y="1076" width="632" height="240" rx="16" fill="#fffdf8" stroke="#e4d8c8"/>
  <circle cx="78" cy="1156" r="28" fill="#7c3140"/>
  <text x="78" y="1166" text-anchor="middle" font-size="26" fill="#fff">5</text>
  <text x="124" y="1140" font-size="26" fill="#1c1915">裤脚对着鞋面看</text>
  <text x="124" y="1178" font-size="20" fill="#3a342c">正装裤前面轻轻碰鞋面。</text>
  <text x="124" y="1212" font-size="20" fill="#3a342c">九分会把脚踝露出来。</text>
  <text x="124" y="1246" font-size="18" fill="#6e665c">181 的腿不要在脚踝切一刀。</text>
  <g transform="translate(500 1124)">
    <path d="M8 8h28l2 62H10z" fill="#1c1c1c"/>
    <path d="M4 66h40v14c0 10-8 16-14 16H12c-8-2-10-10-8-16z" fill="#6b4b32"/>
    <text x="24" y="100" text-anchor="middle" font-size="13" fill="#3f5134">碰鞋面</text>
    <path d="M78 8h24l2 40H80z" fill="#1c1c1c"/>
    <rect x="82" y="48" width="16" height="18" fill="#e0b07c"/>
    <path d="M74 66h36v12H72z" fill="#6b4b32"/>
    <text x="92" y="100" text-anchor="middle" font-size="13" fill="#7c3140">九分</text>
  </g>

  <rect x="24" y="1340" width="632" height="140" rx="16" fill="#1e3558"/>
  <text x="48" y="1390" font-size="24" fill="#f4efe4">胸口还空，也不要放大。</text>
  <text x="48" y="1430" font-size="20" fill="#e4d3bc">用燕麦高领填厚度。肩缝改不了，袖和裤脚可以改。</text>
</g>
</svg>
